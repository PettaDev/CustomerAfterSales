name: Security Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Production dependency audit
        id: dependency_audit
        continue-on-error: true
        run: npm audit --omit=dev

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Scan Git history and frontend bundle for live-secret formats
        run: python3 docs/security-audit/scan_history.py

      - name: Fail if production dependency audit found vulnerabilities
        if: steps.dependency_audit.outcome == 'failure'
        run: |
          echo "Production dependency vulnerabilities were found. See the audit step above."
          exit 1
