name: Security Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Production dependency audit
        id: dependency_audit
        continue-on-error: true
        run: npm audit --omit=dev

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Scan Git history and frontend bundle for live-secret formats
        run: python3 docs/security-audit/scan_history.py

      - name: Generate PDF in isolated Python environment
        run: |
          python3 -m venv .audit-venv
          .audit-venv/bin/pip install --disable-pip-version-check --no-cache-dir reportlab==4.4.9 matplotlib==3.10.8
          .audit-venv/bin/python docs/security-audit/generate_report.py

      - name: Preserve audit PDF as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: brte-security-audit
          path: docs/security-audit/relatorio-auditoria-seguranca.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Fail if production dependency audit found vulnerabilities
        if: steps.dependency_audit.outcome == 'failure'
        run: |
          echo "Production dependency vulnerabilities were found. See the audit step above."
          exit 1
